<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم - الانتخابات المدرسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-box { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <!-- الشريط العلوي العماني -->
    <div class="h-2 w-full bg-gradient-to-r from-red-600 via-white to-green-600 no-print mb-6"></div>

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- الترويسة الرسمية للتقرير -->
        <header class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 text-center print-box">
            <div class="flex justify-center gap-3 mb-2 no-print">
                <span class="bg-red-600 text-white px-3 py-1 rounded-full text-sm font-bold">سلطنة عمان</span>
                <span class="bg-green-700 text-white px-3 py-1 rounded-full text-sm font-bold">وزارة التعليم</span>
            </div>
            <h1 class="text-2xl font-black mb-1">مدرسة جابر بن حيان للتعليم الأساسي</h1>
            <h2 class="text-xl font-bold text-emerald-400 mb-2">التقرير النهائي لنتائج انتخابات تشكيل اللجان وأمين الصف</h2>
            <p class="text-slate-400 text-sm">تحت إشراف مربي الصف: أ. فيصل العريبي</p>
            <div class="mt-4 flex justify-center gap-6 text-sm text-slate-300">
                <span>إجمالي الطلاب المقترعين: <strong id="total-voters" class="text-emerald-400">0</strong></span>
            </div>
        </header>

        <!-- أزرار التحكم -->
        <div class="flex justify-between items-center no-print">
            <button onclick="location.reload()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg font-bold">تحديث البيانات الحية</button>
            <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-bold shadow-lg">طباعة التقرير الرسمي</button>
        </div>

        <!-- تحليل النتائج واللجان -->
        <div id="results-container" class="space-y-6">
            <!-- يتم تعبئة النتائج ديناميكياً هنا -->
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const res = await fetchVotingData();
            if (res && res.data) {
                renderTeacherDashboard(res.data);
            } else {
                alert('فشل في تحميل بيانات النتائج.');
            }
        });

        function renderTeacherDashboard(data) {
            document.getElementById('total-voters').innerText = data.voters ? data.voters.length : 0;
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            if (!data.committees) return;

            data.committees.forEach(committee => {
                const committeeVotes = (data.votes && data.votes[committee]) ? data.votes[committee] : {};
                
                // حساب إجمالي الأصوات لهذه اللجنة
                let totalVotes = 0;
                Object.values(committeeVotes).forEach(v => totalVotes += v);

                // البحث عن المرشح الفائز بالمركز الأول
                let winner = "لم يتم التصويت بعد";
                let maxVotes = -1;
                Object.entries(committeeVotes).forEach(([student, votes]) => {
                    if (votes > maxVotes) {
                        maxVotes = votes;
                        winner = student;
                    }
                });

                let html = `
                    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 print-box">
                        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                            <h3 class="text-xl font-bold text-emerald-400">${committee}</h3>
                            <span class="bg-slate-900 px-3 py-1 rounded-lg text-sm text-slate-300">إجمالي الأصوات: ${totalVotes}</span>
                        </div>
                        
                        <div class="mb-4 p-3 bg-emerald-950/40 border border-emerald-500/30 rounded-xl">
                            <span class="text-sm text-emerald-400 font-semibold">المرشح الفائز حالياً: </span>
                            <span class="text-white font-bold text-lg">${maxVotes > 0 ? winner : 'قيد الانتظار'}</span>
                            ${maxVotes > 0 ? `<span class="text-xs text-slate-400 mr-2">(${maxVotes} صوت)</span>` : ''}
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-right text-sm">
                                <thead class="bg-slate-900 text-slate-400">
                                    <tr>
                                        <th class="p-3 rounded-r-lg">اسم المرشح</th>
                                        <th class="p-3">عدد الأصوات</th>
                                        <th class="p-3 rounded-l-lg">النسبة المئوية</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-700">
                `;

                const allStudents = [...data.classes["9-1"], ...data.classes["9-2"]];
                
                // ترتيب الطلاب حسب عدد الأصوات تنازلياً
                allStudents.sort((a, b) => {
                    const votesA = committeeVotes[a] || 0;
                    const votesB = committeeVotes[b] || 0;
                    return votesB - votesA;
                });

                allStudents.forEach(student => {
                    const votes = committeeVotes[student] || 0;
                    const percentage = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;

                    html += `
                        <tr class="hover:bg-slate-750">
                            <td class="p-3 font-medium text-white">${student}</td>
                            <td class="p-3 font-bold text-emerald-400">${votes}</td>
                            <td class="p-3">
                                <div class="flex items-center gap-2">
                                    <div class="w-full bg-slate-900 rounded-full h-2.5 max-w-[120px]">
                                        <div class="bg-emerald-500 h-2.5 rounded-full" style="width: ${percentage}%"></div>
                                    </div>
                                    <span class="text-xs text-slate-400">${percentage}%</span>
                                </div>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table></div></div>`;
                container.innerHTML += html;
            });
        }
    </script>
</body>
</html>
