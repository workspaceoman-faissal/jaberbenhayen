<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم معلم الفصل - النتائج والتقارير</title>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <div>
            <h2>تقرير نتائج الانتخابات المدرسية</h2>
            <p>المشرف العام: <strong id="supervisorName">أ. فيصل العريبي</strong></p>
        </div>
        <div>
            <h3 id="schoolName">مدرسة جابر بن حيان للتعليم الأساسي</h3>
        </div>
    </div>

    <div class="control-panel">
        <label for="filterClass">عرض النتائج حسب الشعبة:</label>
        <select id="filterClass" onchange="renderResults(this.value)">
            <option value="9-1">الشعبة 9-1</option>
            <option value="9-2">الشعبة 9-2</option>
        </select>

        <button class="btn-action" onclick="handleCSVExport()">تصدير إلى CSV</button>
        <button class="btn-print" onclick="window.print()">طباعة التقرير الرسمي</button>
    </div>

    <div class="print-header">
        <h2>تقرير فرز الأصوات النهائي - الشعبة (<span id="printClassTitle">9-1</span>)</h2>
        <p>التاريخ: <span id="reportDate"></span></p>
    </div>

    <table border="1">
        <thead>
            <tr>
                <th>#</th>
                <th>اسم المرشح</th>
                <th>المنصب / اللجنة</th>
                <th>إجمالي الأصوات</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody id="resultsTableBody">
        </tbody>
    </table>
</div>

<script src="app.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', async () => {
        await fetchVotingData();
        if (userChoices.settings) {
            document.getElementById('schoolName').innerText = userChoices.settings.schoolName;
            document.getElementById('supervisorName').innerText = userChoices.settings.supervisor;
        }
        document.getElementById('reportDate').innerText = new Date().toLocaleDateString('ar-OM');
        
        renderResults("9-1");
    });

    function renderResults(classSection) {
        document.getElementById('printClassTitle').innerText = classSection;
        const results = getResultsByClassSection(classSection);
        const tbody = document.getElementById('resultsTableBody');
        tbody.innerHTML = "";

        if (results.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">لا توجد بيانات أصوات لهذه الشعبة حالياً.</td></tr>`;
            return;
        }

        results.forEach((row, index) => {
            const isWinner = index === 0 && row.votesCount > 0;
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${row.candidate.name}</td>
                    <td>${row.candidate.position}</td>
                    <td><strong>${row.votesCount}</strong></td>
                    <td>${isWinner ? '<span class="winner-badge">فائز</span>' : 'مرشح'}</td>
                </tr>
            `;
        });
    }

    function handleCSVExport() {
        const currentClass = document.getElementById('filterClass').value;
        exportResultsToCSV(currentClass);
    }
</script>
</body>
</html>
