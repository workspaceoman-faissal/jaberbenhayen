<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الانتخابات المدرسية - مدرسة جابر بن حيان</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- الشريط العلوي العماني -->
    <div class="h-2 w-full bg-gradient-to-r from-red-600 via-white to-green-600"></div>

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <!-- الهوية الرسمية -->
        <header class="text-center mb-8 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
            <div class="flex justify-center gap-3 mb-3">
                <span class="bg-red-600 text-white px-3 py-1 rounded-full text-sm font-bold">سلطنة عمان</span>
                <span class="bg-green-700 text-white px-3 py-1 rounded-full text-sm font-bold">وزارة التعليم</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-black mb-2">مدرسة جابر بن حيان للتعليم الأساسي</h1>
            <p class="text-emerald-400 font-semibold text-lg">انتخابات تشكيل اللجان المدرسية وأمين الصف (الصف التاسع)</p>
            <p class="text-slate-400 text-sm mt-1">تحت إشراف مربی الصف: أ. فيصل العريبي</p>
        </header>

        <!-- مرحلة تسجيل الطالب -->
        <div id="login-section" class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 max-w-lg mx-auto">
            <h2 class="text-xl font-bold mb-4 text-center text-emerald-400">تسجيل بيانات الناخب</h2>
            <form id="voter-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">الاسم الكامل للطالب:</label>
                    <input type="text" id="student-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-emerald-500 focus:outline-none" placeholder="اكتب اسمك الثلاثي أو الرباعي">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">الشعبة الدراسية:</label>
                    <select id="student-class" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:border-emerald-500 focus:outline-none">
                        <option value="">-- اختر الشعبة --</option>
                        <option value="9-1">التاسع / 1</option>
                        <option value="9-2">التاسع / 2</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition duration-200 shadow-lg">الدخول إلى ورقة الاقتراع</button>
            </form>
        </div>

        <!-- مرحلة الاقتراع واللجان -->
        <div id="voting-section" class="hidden space-y-6">
            <div class="bg-slate-800 p-4 rounded-xl flex justify-between items-center border border-slate-700">
                <div>
                    <span class="text-slate-400 text-sm">الطالب الناخب: </span>
                    <span id="display-name" class="font-bold text-emerald-400"></span>
                </div>
                <div>
                    <span class="text-slate-400 text-sm">الشعبة: </span>
                    <span id="display-class" class="font-bold text-white"></span>
                </div>
            </div>

            <form id="ballot-form" class="space-y-6">
                <div id="committees-container">
                    <!-- يتم تعبئة اللجان والمرشحين ديناميكياً هنا -->
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-xl transition duration-200 shadow-xl text-lg">اعتماد وإرسال الأصوات</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // كود تشغيل الواجهة التفاعلية للطالب
        let globalData = null;
        const currentVoter = { name: '', class: '' };

        window.addEventListener('DOMContentLoaded', async () => {
            const res = await fetchVotingData();
            if (res && res.data) {
                globalData = res.data;
            } else {
                alert('حدث خطأ في تحميل بيانات المنصة.');
            }
        });

        document.getElementById('voter-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('student-name').value.trim();
            const cls = document.getElementById('student-class').value;
            
            if (!name || !cls) return alert('يرجى كتابة الاسم واختيار الشعبة');

            currentVoter.name = name;
            currentVoter.class = cls;

            document.getElementById('display-name').innerText = name;
            document.getElementById('display-class').innerText = cls === '9-1' ? 'التاسع / 1' : 'التاسع / 2';

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('voting-section').classList.remove('hidden');

            renderBallotForms();
        });

        function renderBallotForms() {
            const container = document.getElementById('committees-container');
            container.innerHTML = '';

            // هيكل الأصوات الافتراضي إذا لم يكن موجوداً
            if (!globalData.votes) globalData.votes = {};

            globalData.committees.forEach((committee, cIndex) => {
                if (!globalData.votes[committee]) globalData.votes[committee] = {};
                
                let html = `
                    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 mb-6">
                        <h3 class="text-xl font-bold text-emerald-400 mb-4 pb-2 border-b border-slate-700">${committee}</h3>
                        <div class="space-y-3">
                `;

                // دمج طلاب الصفين ليكونوا مرشحين متاحين في اللجان
                const allStudents = [...globalData.classes["9-1"], ...globalData.classes["9-2"]];
                
                // حساب مجموع الأصوات للجنة الحالية لحساب النسب المئوية الحية
                let totalCommitteeVotes = 0;
                allStudents.forEach(student => {
                    totalCommitteeVotes += (globalData.votes[committee][student] || 0);
                });

                allStudents.forEach((student, sIndex) => {
                    const votesCount = globalData.votes[committee][student] || 0;
                    const percentage = totalCommitteeVotes > 0 ? Math.round((votesCount / totalCommitteeVotes) * 100) : 0;

                    html += `
                        <label class="flex items-center justify-between p-3 rounded-xl bg-slate-900 border border-slate-700 hover:border-emerald-500 cursor-pointer transition">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="committee_${cIndex}" value="${student}" required class="w-4 h-4 text-emerald-600 focus:ring-emerald-500">
                                <span class="font-medium text-white">${student}</span>
                            </div>
                            <div class="text-left text-xs text-slate-400">
                                <span class="text-emerald-400 font-bold">${votesCount}</span> صوت (${percentage}%)
                            </div>
                        </label>
                    `;
                });

                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        document.getElementById('ballot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!globalData.voters) globalData.voters = [];
            if (globalData.voters.includes(currentVoter.name)) {
                alert('عذراً، لقد قمت بالتصويت مسبقاً ولا يمكنك التصويت مرة أخرى.');
                return;
            }

            // جمع الأصوات المختارة
            globalData.committees.forEach((committee, cIndex) => {
                const selectedRadio = document.querySelector(`input[name="committee_${cIndex}"]:checked`);
                if (selectedRadio) {
                    const chosenStudent = selectedRadio.value;
                    if (!globalData.votes[committee]) globalData.votes[committee] = {};
                    globalData.votes[committee][chosenStudent] = (globalData.votes[committee][chosenStudent] || 0) + 1;
                }
            });

            globalData.voters.push(currentVoter.name);

            // حفظ التحديث سحابياً
            const success = await saveVotingDataToGitHub(globalData);
            if (success) {
                alert('تم تسجيل صوتك بنجاح وشكراً لمشاركتك الديمقراطية!');
                location.reload();
            } else {
                alert('حدث خطأ أثناء حفظ الصوت، يرجى المحاولة مرة أخرى.');
            }
        });
    </script>
</body>
</html>
