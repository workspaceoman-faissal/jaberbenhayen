<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب - الانتخابات المدرسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* تأثير الإطار ثلاثي الأبعاد الفاخر للترويسة */
        .header-3d {
            background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
            box-shadow: 
                0 10px 25px -5px rgba(6, 78, 59, 0.4),
                0 8px 10px -6px rgba(6, 78, 59, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.2),
                inset 0 -4px 6px rgba(0, 0, 0, 0.3);
            border-bottom: 5px solid #f59e0b;
            transform: perspective(1000px);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    
    <!-- ترويسة ثلاثية الأبعاد مع نصوص متمركزة في الوسط وفصل سطر الإشراف -->
    <header class="w-full py-6 px-4 header-3d text-white mb-8">
        <div class="max-w-4xl mx-auto flex flex-col items-center justify-center text-center gap-3">
            <!-- أيقونة / شعار المدرسة في المنتصف -->
            <div class="w-16 h-16 bg-gradient-to-tr from-amber-400 to-amber-500 text-slate-900 rounded-2xl flex items-center justify-center text-3xl shadow-xl shrink-0 border-2 border-white/30 transform hover:scale-105 transition duration-300">
                🎓
            </div>
            <!-- النصوص الرسمية منسقة ومرتبة في الوسط -->
            <div class="space-y-1">
                <h1 class="text-xl sm:text-2xl font-black tracking-wide drop-shadow-md">سلطنة عمان</h1>
                <h2 class="text-lg sm:text-xl font-bold tracking-wide text-emerald-100 drop-shadow">وزارة التعليم</h2>
                <p class="text-sm text-emerald-200 font-semibold">مدرسة جابر بن حيان للتعليم الأساسي (5-9)</p>
                
                <!-- بطاقة الفعالية مع وضع سطر الإشراف في سطر جديد -->
                <div class="bg-emerald-950/40 px-4 py-2 rounded-2xl inline-block mt-2 shadow-inner border border-emerald-800/50">
                    <p class="text-xs text-amber-300 font-medium">انتخابات لجان الصف التاسع وأمين الصف</p>
                    <p class="text-xs text-amber-200 font-bold mt-1">بإشراف مربي الصف: أ. فيصل العريبي</p>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-xl mx-auto p-4 md:p-6">
        <!-- مرحلة تسجيل الطالب -->
        <div id="login-section" class="bg-white p-8 rounded-3xl shadow-2xl border border-slate-200 text-center">
            <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                🔒
            </div>
            <h2 class="text-2xl font-black mb-1 text-slate-800">تسجيل دخول الطالب للتصويت</h2>
            <p class="text-slate-500 text-sm mb-6">الرجاء إدخال بياناتك للمشاركة في الانتخابات الصفية</p>
            
            <form id="voter-form" class="space-y-4 text-right">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">الاسم الثلاثي والقبيلة:</label>
                    <input type="text" id="student-name" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-800 focus:border-emerald-600 focus:bg-white focus:outline-none transition" placeholder="مثال: سالم بن سعيد المعشري">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">شعبة الصف التاسع:</label>
                    <select id="student-class" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-800 focus:border-emerald-600 focus:bg-white focus:outline-none transition">
                        <option value="">-- اختر الشعبة --</option>
                        <option value="9-1">التاسع (1)</option>
                        <option value="9-2">التاسع (2)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-[#064e3b] hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg mt-4">الانتقال لورقة الاقتراع</button>
            </form>
        </div>

        <!-- مرحلة الاقتراع واللجان -->
        <div id="voting-section" class="hidden space-y-6">
            <div class="bg-white p-4 rounded-2xl shadow border border-slate-200 flex justify-between items-center">
                <div>
                    <span class="text-slate-500 text-xs block">الطالب الناخب:</span>
                    <span id="display-name" class="font-bold text-emerald-800 text-base"></span>
                </div>
                <div>
                    <span class="text-slate-500 text-xs block">الشعبة:</span>
                    <span id="display-class" class="font-bold text-slate-800 text-base"></span>
                </div>
            </div>

            <form id="ballot-form" class="space-y-6">
                <div id="committees-container">
                    <!-- تعبئة ديناميكية -->
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-2xl transition duration-200 shadow-xl text-lg">اعتماد وإرسال الأصوات النهائية</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        let globalData = null;
        const currentVoter = { name: '', class: '' };

        window.addEventListener('DOMContentLoaded', async () => {
            const res = await fetchVotingData();
            if (res && res.data) {
                globalData = res.data;
            } else {
                alert('حدث خطأ في تحميل بيانات المنصة.');
            }
        });

        document.getElementById('voter-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('student-name').value.trim();
            const cls = document.getElementById('student-class').value;
            
            if (!name || !cls) return alert('يرجى كتابة الاسم واختيار الشعبة');
            if (!globalData) return alert('البيانات لم تحمّل بعد، يرجى الانتظار ثانية.');

            currentVoter.name = name;
            currentVoter.class = cls;

            document.getElementById('display-name').innerText = name;
            document.getElementById('display-class').innerText = cls === '9-1' ? 'التاسع (1)' : 'التاسع (2)';

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('voting-section').classList.remove('hidden');

            renderBallotForms();
        });

        function renderBallotForms() {
            const container = document.getElementById('committees-container');
            container.innerHTML = '';
            if (!globalData.votes) globalData.votes = {};

            globalData.committees.forEach((committee, cIndex) => {
                if (!globalData.votes[committee]) globalData.votes[committee] = {};
                const allStudents = [...globalData.classes["9-1"], ...globalData.classes["9-2"]];
                
                let totalCommitteeVotes = 0;
                allStudents.forEach(student => {
                    totalCommitteeVotes += (globalData.votes[committee][student] || 0);
                });

                let html = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl border border-slate-200 mb-6">
                        <h3 class="text-xl font-bold text-emerald-800 mb-2 border-b pb-2">${committee}</h3>
                        <label class="block text-sm font-semibold text-slate-600 mb-2">اختر المرشح المناسب:</label>
                        <select name="committee_${cIndex}" required class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-slate-800 focus:border-emerald-600 focus:bg-white focus:outline-none mb-2">
                            <option value="">-- اختر مرشحك لهذه اللجنة --</option>
                `;

                allStudents.forEach(student => {
                    const votesCount = globalData.votes[committee][student] || 0;
                    const percentage = totalCommitteeVotes > 0 ? Math.round((votesCount / totalCommitteeVotes) * 100) : 0;
                    html += `<option value="${student}">${student} (الأصوات الحالية: ${votesCount} - ${percentage}%)</option>`;
                });

                html += `</select></div>`;
                container.innerHTML += html;
            });
        }

        document.getElementById('ballot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!globalData.voters) globalData.voters = [];
            
            if (globalData.voters.includes(currentVoter.name)) {
                alert('عذراً، لقد قمت بالتصويت مسبقاً ولا يمكنك التصويت مرة أخرى.');
                return;
            }

            globalData.committees.forEach((committee, cIndex) => {
                const selectedSelect = document.querySelector(`select[name="committee_${cIndex}"]`);
                if (selectedSelect && selectedSelect.value) {
                    const chosenStudent = selectedSelect.value;
                    if (!globalData.votes[committee]) globalData.votes[committee] = {};
                    globalData.votes[committee][chosenStudent] = (globalData.votes[committee][chosenStudent] || 0) + 1;
                }
            });

            globalData.voters.push(currentVoter.name);
            const success = await saveVotingDataToGitHub(globalData);
            if (success) {
                alert('تم تسجيل صوتك بنجاح وشكراً لمشاركتك!');
                location.reload();
            } else {
                alert('حدث خطأ أثناء حفظ الصوت، يرجى المحاولة مرة أخرى.');
            }
        });
    </script>
</body>
</html>
